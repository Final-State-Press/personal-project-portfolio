name: Release

# Manual/tag-triggered macOS packaging. Signing and notarization are added
# once Apple credentials are provisioned (see docs/architecture/decisions/
# adr-010-macos-arch.md). This lane builds the frozen sidecar and the Tauri app.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@1.88.0

      # Hash-pinned lockfile (runtime + PyInstaller): the signed build uses exactly the
      # audited versions. See backend/README.md for how it is regenerated.
      - name: Install backend dependencies (locked)
        run: |
          pip install --require-hashes -r backend/requirements-dev.lock
          pip install --no-deps -e ./backend

      - name: Build sidecar binary
        run: python scripts/build_sidecar.py --target-triple $(rustc -Vv | grep host | cut -d' ' -f2)

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-manager-macos
          path: src-tauri/target/release/bundle/**
